<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="1100" height="700" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#152b40"><text x="40" y="45" font-size="25">XIAO ESP32-C5 · analog FPV receiver wiring</text><text x="40" y="75" font-size="15">C5VRX reference circuit by Twotoz and contributors · unofficial build companion</text><rect x="40" y="110" width="230" height="410" rx="8" fill="#e2eaf2" stroke="#526c85"/><text x="60" y="138" font-size="18">XIAO ESP32-C5</text><text x="60" y="185" font-size="16">D4 / GPIO 23</text><path d="M270 180 H350 M430 180 H570" fill="none" stroke="#287493" stroke-width="3"/><rect x="350" y="170" width="80" height="20" fill="white" stroke="#287493" stroke-width="2"/><text x="365" y="163" font-size="13">8.2 kΩ</text><circle cx="570" cy="180" r="4" fill="#287493"/><text x="60" y="235" font-size="16">D5 / GPIO 24</text><path d="M270 230 H350 M430 230 H570" fill="none" stroke="#287493" stroke-width="3"/><rect x="350" y="220" width="80" height="20" fill="white" stroke="#287493" stroke-width="2"/><text x="365" y="213" font-size="13">3.9 kΩ</text><circle cx="570" cy="230" r="4" fill="#287493"/><text x="60" y="285" font-size="16">D6 / GPIO 11</text><path d="M270 280 H350 M430 280 H570" fill="none" stroke="#287493" stroke-width="3"/><rect x="350" y="270" width="80" height="20" fill="white" stroke="#287493" stroke-width="2"/><text x="365" y="263" font-size="13">2.0 kΩ</text><circle cx="570" cy="280" r="4" fill="#287493"/><text x="60" y="335" font-size="16">D7 / GPIO 12</text><path d="M270 330 H350 M430 330 H570" fill="none" stroke="#287493" stroke-width="3"/><rect x="350" y="320" width="80" height="20" fill="white" stroke="#287493" stroke-width="2"/><text x="365" y="313" font-size="13">1.0 kΩ</text><circle cx="570" cy="330" r="4" fill="#287493"/><text x="60" y="385" font-size="16">D8 / GPIO 8</text><path d="M270 380 H350 M430 380 H570" fill="none" stroke="#287493" stroke-width="3"/><rect x="350" y="370" width="80" height="20" fill="white" stroke="#287493" stroke-width="2"/><text x="365" y="363" font-size="13">470 Ω</text><circle cx="570" cy="380" r="4" fill="#287493"/><text x="60" y="435" font-size="16">D9 / GPIO 9</text><path d="M270 430 H350 M430 430 H570" fill="none" stroke="#287493" stroke-width="3"/><rect x="350" y="420" width="80" height="20" fill="white" stroke="#287493" stroke-width="2"/><text x="365" y="413" font-size="13">240 Ω</text><circle cx="570" cy="430" r="4" fill="#287493"/><path d="M570 180 V430 M570 180 H820 V230 H870 M660 180 V465 M660 505 V580 M770 180 V472 M770 489 V580 M270 480 H305 V580 H975 V350" fill="none" stroke="#287493" stroke-width="3"/><circle cx="660" cy="180" r="4" fill="#287493"/><circle cx="770" cy="180" r="4" fill="#287493"/><text x="585" y="163" font-size="17">VIDEO</text><text x="60" y="485" font-size="16">GND</text><rect x="650" y="465" width="20" height="40" fill="white" stroke="#287493" stroke-width="2"/><text x="595" y="490" font-size="14">200 Ω</text><path d="M750 473 H790 M750 488 H790" stroke="#287493" stroke-width="3"/><text x="795" y="490" font-size="14">470 pF</text><circle cx="660" cy="580" r="4" fill="#287493"/><circle cx="770" cy="580" r="4" fill="#287493"/><text x="480" y="605" font-size="14">Common signal ground</text><rect x="870" y="195" width="190" height="155" rx="6" fill="#e2eaf2" stroke="#526c85"/><text x="890" y="230" font-size="16">CVBS input</text><text x="890" y="263" font-size="15">Monitor / goggles</text><text x="890" y="295" font-size="13">75 Ω termination</text><text x="40" y="650" font-size="14">All six resistor branches join VIDEO. The 200 Ω shunt and 470 pF capacitor connect VIDEO to GND.</text><text x="40" y="674" font-size="14">Check the loaded video level with your actual display. USB supplies the receiver. Diagram is not to scale.</text></g></svg>