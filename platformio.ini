; C5VRX (Seeed Studio XIAO ESP32-C5) -- PlatformIO project configuration.
;
; The official platformio/espressif32 platform supports neither the ESP32-C5
; nor ESP-IDF 6, so the community pioarduino platform is pinned at a fixed
; develop-branch commit. That platform needs the pioarduino core fork of
; PlatformIO (pip install pioarduino) and ships a toolchain older than the
; one ESP-IDF 6.0 insists on; tools/pio_idf_toolchain.py installs and uses
; the exact riscv32-esp-elf version from the framework's tools.json.
;
; All receiver parameters are fixed in sdkconfig.defaults. PlatformIO writes
; the generated configuration to sdkconfig.xiao_c5 (git-ignored); delete that
; file to re-apply sdkconfig.defaults after editing it.
;
; Run pio from PowerShell or cmd on Windows: the ESP-IDF tool installer
; refuses to run under MSYS/Git Bash.

[platformio]
default_envs = xiao_c5
src_dir = main

[env:xiao_c5]
platform = https://github.com/pioarduino/platform-espressif32.git#59fa8606f96e68f1bc021ba5f4ece28be0d1c42f
platform_packages =
    pioarduino/framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v6.0.1/esp-idf-v6.0.1.tar.xz
    ; The pinned platform commit declares tool-esptoolpy as 5.3.1 but links the
    ; 5.4.0 manifest; its installer then removes the package during every build.
    ; Pin the manifest whose version matches the declaration.
    pioarduino/tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.3.1.zip
framework = espidf
board = seeed_xiao_esp32c5
board_build.partitions = partitions.csv
; sdkconfig.defaults selects QIO at 80 MHz, but the XIAO's flash does not boot
; in QIO (ROM: "Invalid image block" then a watchdog loop); tools/auto_flash.py
; therefore writes the images as DIO at 80 MHz, and so do these headers.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts = pre:tools/pio_idf_toolchain.py
monitor_speed = 115200
upload_speed = 460800

; Link mode: no DAC output, BitScrambler in loopback, 'v' dumps raw + CVBS for
; tools/link_dump.py (first step of the T-Embed display link).
[env:xiao_c5_link]
extends = env:xiao_c5
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.link.defaults"

; Link mode with the desk tools: [STREAM] statistics, 'v' / 'g' dumps
; (tools/link_dump.py, tools/link_frame.py), AGC status lines.
[env:xiao_c5_link_debug]
extends = env:xiao_c5
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.link.defaults;sdkconfig.link.debug.defaults"
