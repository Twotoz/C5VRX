name: Deploy Web Flasher

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/prepare_pages_site.sh"
      - ".github/workflows/deploy-web.yml"
  workflow_run:
    workflows: ["C5VRX-5 Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write # create a deployment-only Git commit; never update a branch
  pages: write
  id-token: write

# GitHub Pages accepts one deployment at a time. Never cancel an active Pages
# deployment: release/PR mirror refreshes queue behind the current deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages Site
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted main web source
        id: web-source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build same-origin firmware mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/prepare_pages_site.sh pages-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web flasher and mirrored firmware
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/

      # Pages requires an existing Git commit as its build version. Create a
      # unique commit object with the checked-out main tree, without changing
      # any branch, so same-main release refreshes cannot reuse an old deploy.
      - name: Give this mirror refresh a unique deployment version
        id: pages-version
        uses: actions/github-script@v7
        with:
          script: |
            const {data: source} = await github.rest.git.getCommit({
              ...context.repo, commit_sha: '${{ steps.web-source.outputs.commit }}'
            });
            const {data: version} = await github.rest.git.createCommit({
              ...context.repo, tree: source.tree.sha, parents: [source.sha],
              message: `Pages mirror ${context.runId}/${process.env.GITHUB_RUN_ATTEMPT}`
            });
            core.setOutput('version', version.sha);

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/github-script@v7
        timeout-minutes: 11
        env:
          PAGES_BUILD_VERSION: ${{ steps.pages-version.outputs.version }}
        with:
          script: |
            // GITHUB_SHA is a protected runner variable. Send the unique build
            // version directly instead of trying to override it for deploy-pages.
            const {data: {artifacts}} = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.runId
            });
            const matches = artifacts.filter(artifact => artifact.name === 'github-pages' && !artifact.expired);
            if (matches.length !== 1) throw new Error('Expected exactly one Pages artifact for this run');
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: matches[0].id,
              pages_build_version: process.env.PAGES_BUILD_VERSION,
              oidc_token: await core.getIDToken()
            });
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            core.info(`Created Pages deployment ${deploymentId} for mirror version ${process.env.PAGES_BUILD_VERSION}`);
            core.setOutput('page_url', deployment.page_url);
            const deadline = Date.now() + 600000;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo, pages_deployment_id: deploymentId
              });
              if (status.status === 'succeed') {
                core.info('Pages deployment succeeded');
                return;
              }
              if (/failed|cancelled/.test(status.status)) throw new Error(`Pages deployment ${status.status}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              ...context.repo, pages_deployment_id: deploymentId
            });
            throw new Error('Pages deployment timed out after 10 minutes');
