name: C5VRX CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware-build:
    name: ESP32-C5 / ESP-IDF v6.0.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-C5 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c5
          path: .

  phy-analysis:
    name: ESP32-C5 PHY reverse engineering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ESP32-C5 PHY/RF-test report
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c5
          path: .
          command: python tools/analyze_phy.py --out phy-analysis.md

      - name: Upload PHY analysis
        uses: actions/upload-artifact@v4
        with:
          name: esp32c5-phy-analysis
          path: phy-analysis.md
          if-no-files-found: error

  host-tools:
    name: Host-side DSP / tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSP dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: WBFM discriminator self-test
        run: python tools/wbfm_demod.py --self-test

      - name: ADC dump decoder self-test
        run: python tools/decode_adc_dump.py --self-test

      - name: Capture diagnostics self-test
        run: python tools/analyze_iq_capture.py --self-test

      - name: Generate FPV channel report
        run: python tools/fpv_channel_report.py
